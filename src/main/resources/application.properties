spring.application.name=shopforge

# --- Externalized config ---
# This one line is a real Spring Boot feature (not a third-party library): it tells Spring Boot
# to also read key=value pairs from a file named ".env" in the working directory (the "shopforge"
# folder you run `mvnw spring-boot:run` from), on top of this application.properties file.
# "optional:" means it's fine if .env doesn't exist at all -- Spring just skips it silently.
# The "[.properties]" suffix is a format hint: it tells Spring "read .env using properties-file
# syntax", since Spring wouldn't otherwise know how to parse a file with the extension ".env".
#
# Why bother: this is the mechanism that lets the ${...} placeholders below pull *real* secrets
# (DB passwords, mail credentials) from a file that's excluded from version control (see
# .gitignore), instead of typing them directly into this file, which git *does* track. Copy
# .env.example to .env and fill in real values -- .env itself is never committed.
spring.config.import=optional:file:.env[.properties]

# --- Database Connection ---
# ${DB_USER:shopforge} means: "use the environment variable/property DB_USER if one is set,
# otherwise fall back to the literal value shopforge". A default here is fine because it's not
# a secret -- it's just the username our docker-compose.yml Postgres container happens to use.
# DB_PASSWORD has NO default on purpose: if it's genuinely unset, Spring Boot will refuse to
# start with a clear "could not resolve placeholder" error instead of silently connecting with
# a well-known password. That's called "failing fast" -- for a real password we WANT the app
# to loudly refuse to start rather than quietly using something insecure.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopforge}
spring.datasource.username=${DB_USER:shopforge}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Config
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ShopForgeHikari

# JPA & Hibernate properties (Flyway owns schema, set ddl-auto=validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_size=30

# Flyway migration configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Turn off the Spring Boot Banner
spring.main.banner-mode=off

# Reduce logging level
logging.level.root=info

# --- JWT Configuration ---
# JwtUtil (auth/security/JwtUtil.java) uses this string as the HMAC signing key for every access
# and refresh token it issues. Anyone who has this value can forge a valid token for ANY user --
# it's the single most sensitive value in the whole app. The default below is a freshly generated,
# never-used-anywhere-else key, safe for solo local development, but it still lives in this file,
# which means anyone who ever reads this repo (e.g. if it's pushed to a public GitHub) reads it
# too. So: fine as a *local* default, but any real/shared/deployed environment MUST set its own
# JWT_SECRET env var (or .env entry) instead of relying on this fallback.
jwt.secret=${JWT_SECRET:Exme/cG3Bj2OCjkzEE9f9aO2unhC/yHA1ZWTa2wbdoo=}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:900}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800}

# Google OAuth2 Client Configuration
# The client ID is NOT a secret (it's baked into every OAuth redirect URL your browser makes,
# so it's already public) -- only the *client secret* is sensitive, and this backend never needs
# it (only the Next.js frontend does, to exchange an auth code server-side). Safe to default here.
google.client-id=${GOOGLE_CLIENT_ID:1042619715922-gpp00qaj9g86ti6p0uthvbu923avp1pl.apps.googleusercontent.com}

# --- SMTP / Spring Mail Configuration ---
# Local development defaults to Mailhog (see docker-compose.yml) instead of real Gmail: Mailhog
# pretends to be an SMTP server on localhost:1025 but just captures every email into a web inbox
# at http://localhost:8025, so you can see exactly what "Order Shipped" or "Reset your password"
# emails look like without needing a real Gmail account, an app password, or risking sending test
# emails to a real inbox. Mailhog doesn't require a username/password or STARTTLS, hence the
# empty/false defaults below. To send through real Gmail instead (e.g. for a deployed instance),
# set SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_USERNAME, SMTP_PASSWORD (a Gmail *App
# Password*, not your real password), SMTP_AUTH=true and SMTP_STARTTLS=true via env vars/.env.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

